name: Setup Windows Build Toolchain
description: Install the SDKs declared by the repository and expose the pinned Rust toolchain.

inputs:
  rust-targets:
    description: Comma-separated Rust targets required by the job.
    required: false
    default: x86_64-pc-windows-msvc
  rust-components:
    description: Comma-separated Rust components required by the job.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup .NET SDK from global.json
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Install Rust toolchain from rust-toolchain.toml
      shell: pwsh
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
        RUST_COMPONENTS: ${{ inputs.rust-components }}
      run: |
        $toolchainPath = Join-Path $env:GITHUB_WORKSPACE 'rust-toolchain.toml'
        $toolchainText = Get-Content -LiteralPath $toolchainPath -Raw
        $channelMatch = [regex]::Match($toolchainText, '(?m)^\s*channel\s*=\s*"(?<channel>[^"]+)"')
        if (-not $channelMatch.Success) {
          throw "Unable to read the Rust channel from $toolchainPath."
        }

        $channel = $channelMatch.Groups['channel'].Value
        $arguments = @('toolchain', 'install', $channel, '--profile', 'minimal', '--no-self-update')
        foreach ($target in ($env:RUST_TARGETS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
          $arguments += @('--target', $target)
        }
        foreach ($component in ($env:RUST_COMPONENTS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
          $arguments += @('--component', $component)
        }

        & rustup @arguments
        if ($LASTEXITCODE -ne 0) {
          throw "Rust toolchain installation failed for $channel."
        }

        "RUSTUP_TOOLCHAIN=$channel" >> $env:GITHUB_ENV
        "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
        & rustup run $channel rustc --version
        & rustup run $channel cargo --version
