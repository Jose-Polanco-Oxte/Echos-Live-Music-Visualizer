name: Official Release (GitHub Releases)

on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part release version (A.B.C.D)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Resolve and Validate Version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION.Trim()
            $tagName = "v$version"
          }
          else {
            $tagName = $env:REF_NAME
            if ($tagName -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
              throw "Release tag must use vA.B.C.D: $tagName"
            }
            $version = $Matches.version
          }

          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release version must use A.B.C.D: $version"
          }
          foreach ($component in $version.Split('.')) {
            if ([int]$component -gt 65535) {
              throw "Release version components must be between 0 and 65535: $version"
            }
          }

          ./scripts/Test-ProductConfiguration.ps1 -ExpectedVersion $version | Out-Null

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

  build-release:
    name: Build and Package GitHub Release (${{ matrix.target_arch }})
    needs: metadata
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target_arch: win-x64
            rust_target: x86_64-pc-windows-msvc
          - target_arch: win-arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pinned build toolchain (${{ matrix.rust_target }})
        uses: ./.github/actions/setup-windows-build
        with:
          rust-targets: ${{ matrix.rust_target }}

      - name: Publish and Validate Unpackaged Self-Contained Distribution
        shell: pwsh
        run: >-
          ./scripts/Build-Distributions.ps1
          -Profile GitHub
          -RuntimeIdentifiers ${{ matrix.target_arch }}
          -BuildVersion ${{ needs.metadata.outputs.version }}
          -SkipTests

      - name: Optional Code Signing with SignTool and PFX
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:SIGNING_CERTIFICATE_BASE64) {
            $certBytes = [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            $certPath = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
            try {
              $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (-not $signTool) { throw 'signtool.exe was not found.' }

              Get-ChildItem 'artifacts/github/${{ matrix.target_arch }}' -Recurse -Include '*.exe','*.dll' |
                ForEach-Object {
                  & $signTool.FullName sign /fd SHA256 /f $certPath /p $env:SIGNING_CERTIFICATE_PASSWORD $_.FullName
                  if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
                }
            }
            finally {
              Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            }
          }
          else {
            Write-Host 'Signing certificate is not configured; skipping Authenticode signing.'
          }

      - name: Compress Unpackaged Distribution
        shell: pwsh
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $zipPath = "artifacts/EchoVisualizer-$version-${{ matrix.target_arch }}.zip"
          Compress-Archive -Path 'artifacts/github/${{ matrix.target_arch }}/*' -DestinationPath $zipPath -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zip-${{ matrix.target_arch }}
          path: artifacts/*.zip

  publish-release:
    name: Create Official GitHub Release
    needs: [metadata, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd artifacts
          sha256sum EchoVisualizer-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Echo Visualizer v${{ needs.metadata.outputs.version }}"
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          draft: false
          prerelease: false
          body: |
            ## Echo Live Music Visualizer v${{ needs.metadata.outputs.version }}

            High-performance Windows real-time audio visualizer powered by Rust WASAPI DSP and WinUI 3 with Win2D rendering.

            ### Download Options
            - `EchoVisualizer-${{ needs.metadata.outputs.version }}-win-x64.zip`: standalone x64 build.
            - `EchoVisualizer-${{ needs.metadata.outputs.version }}-win-arm64.zip`: standalone ARM64 build.

            Extract the appropriate archive and launch `EchoVisualizer.exe`. The distribution is self-contained and does not require a separate Windows App Runtime installation.
          files: |
            artifacts/EchoVisualizer-*.zip
            artifacts/SHA256SUMS.txt
