name: Quality Gate (CI)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, Publish and Validate Distributions
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Run Quality Gates and Validate Distribution Profiles
        shell: pwsh
        run: >-
          ./scripts/Build-Distributions.ps1
          -Profile Both
          -RuntimeIdentifiers win-x64,win-arm64
