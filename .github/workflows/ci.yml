name: Quality Gate (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Publish and Validate Distributions
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pinned build toolchain
        uses: ./.github/actions/setup-windows-build
        with:
          rust-targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          rust-components: rustfmt,clippy

      - name: Run Quality Gates and Validate Distribution Profiles
        shell: pwsh
        run: >-
          ./scripts/Build-Distributions.ps1
          -Profile Both
          -RuntimeIdentifiers win-x64,win-arm64
