name: Quality Gate (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Pinned actionlint
        shell: pwsh
        run: |
          $version = '1.7.12'
          $sha256 = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          $asset = "actionlint_${version}_windows_amd64.zip"
          $url = "https://github.com/rhysd/actionlint/releases/download/v$version/$asset"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $sha256) {
            throw "actionlint digest mismatch. Expected $sha256, found $actual."
          }
          $toolDir = Join-Path $env:RUNNER_TEMP 'actionlint'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $toolDir >> $env:GITHUB_PATH

      - name: Run actionlint
        shell: pwsh
        run: actionlint

      - name: Audit Distribution Literal Duplicates
        shell: pwsh
        run: |
          $configJson = ./scripts/Test-ProductConfiguration.ps1 -AsJson | ConvertFrom-Json
          # Packing base is a schema-1 normative constant enforced by the parser
          # (D6) and icon sizes are validated structurally by the regression
          # harness; both are intentionally excluded from this grep audit.
          # Arbitrary numeric substrings would be collision-prone here.
          $literals = @(
            @{ Label = 'store.productId'; Value = [string]$configJson.store.productId },
            @{ Label = 'store.packageFamilyName'; Value = [string]$configJson.store.packageFamilyName },
            @{ Label = 'store.capabilities'; Value = [string]($configJson.store.capabilities | ForEach-Object { $_.name }) -join ',' },
            @{ Label = 'store.architectures'; Value = [string]($configJson.store.architectures | ForEach-Object { $_.runtimeIdentifier }) -join ',' },
            @{ Label = 'tooling.msstore.version'; Value = [string]$configJson.tooling.msstore.version },
            @{ Label = 'tooling.msstore.assetName'; Value = [string]$configJson.tooling.msstore.assetName },
            @{ Label = 'tooling.msstore.sha256'; Value = [string]$configJson.tooling.msstore.sha256 }
          ) | Where-Object { $_.Value }
          # The artifact type appears structurally as a glob in workflows
          # (*.msixbundle) so it is only scanned in operational scripts.
          $artifactTypeLiteral = @{ Label = 'store.artifactType'; Value = [string]$configJson.store.artifactType }
          # Operational code paths that must consume configuration rather than
          # hard-code it: product scripts (excluding the shared module, which
          # defines the schema), workflows and composite actions. Comment-only
          # lines are documentation, not active duplication; matching uses word
          # boundaries so short values inside hashes/versions do not count.
          $targets = @()
          $targets += Get-ChildItem 'scripts' -Recurse -File -Include *.ps1 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'modules\\' }
          $targets += Get-ChildItem '.github' -Recurse -File -Include *.yml,*.yaml -ErrorAction SilentlyContinue
          $violations = @()
          foreach ($file in $targets) {
            $rel = $file.FullName.Replace((Get-Location).Path + '\', '')
            $lineNumber = 0
            foreach ($line in Get-Content -LiteralPath $file.FullName) {
              $lineNumber++
              $trimmed = $line.TrimStart()
              if ($trimmed.StartsWith('#') -or $trimmed.StartsWith('<!--') -or $trimmed.StartsWith('//')) { continue }
              foreach ($entry in $literals) {
                foreach ($singleValue in @($entry.Value -split ',')) {
                  $pattern = '(?<![\w])' + [regex]::Escape($singleValue) + '(?![\w])'
                  if ([regex]::IsMatch($line, $pattern)) {
                    $violations += ("$($entry.Label)='$singleValue' at $rel`:$lineNumber")
                  }
                }
              }
              if ($file.Extension -eq '.ps1') {
                $pattern = '(?<![\w.])' + [regex]::Escape($artifactTypeLiteral.Value) + '(?![\w])'
                if ([regex]::IsMatch($line, $pattern)) {
                  $violations += ("$($artifactTypeLiteral.Label)='$($artifactTypeLiteral.Value)' at $rel`:$lineNumber")
                }
              }
            }
          }
          $violations = $violations | Sort-Object -Unique
          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Host "DIST-LITERAL: $_" }
            throw "Configurable distribution literals must not be duplicated in operational scripts/workflows; read them from build/Product.props."
          }
          Write-Host 'Distribution literal audit: PASS'

  verify:
    name: Test, Publish and Validate Distributions
    runs-on: windows-2025

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pinned build toolchain
        uses: ./.github/actions/setup-windows-build
        with:
          rust-targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          rust-components: rustfmt,clippy

      - name: Run Quality Gates and Validate Distribution Profiles
        shell: pwsh
        run: >-
          ./scripts/Build-Distributions.ps1
          -Profile Both
          -RuntimeIdentifiers win-x64,win-arm64