name: Microsoft Store Package Build

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional four-part product version (A.B.C.D); Store packages are built with revision 0 (A.B.C.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-store-package:
    name: Build Store MSIX Package (${{ matrix.runtime_identifier }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - runtime_identifier: win-x64
            rust_target: x86_64-pc-windows-msvc
          - runtime_identifier: win-arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pinned build toolchain (${{ matrix.rust_target }})
        uses: ./.github/actions/setup-windows-build
        with:
          rust-targets: ${{ matrix.rust_target }}

      - name: Resolve Package Version
        id: package
        shell: pwsh
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          $version = $env:VERSION_OVERRIDE.Trim()
          $metadata = ./scripts/Test-ProductConfiguration.ps1 -AsJson | ConvertFrom-Json
          if (-not $version) {
            $version = $metadata.Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Package version must use A.B.C.D: $version"
          }
          foreach ($component in $version.Split('.')) {
            if ([int]$component -gt 65535) {
              throw "Package version components must be between 0 and 65535: $version"
            }
          }
          $storeVersion = ($version.Split('.')[0..2] -join '.') + '.0'
          "version=$storeVersion" >> $env:GITHUB_OUTPUT

      - name: Compile and Validate Store MSIX Bundle
        shell: pwsh
        run: >-
          ./scripts/Build-Distributions.ps1
          -Profile Store
          -RuntimeIdentifiers ${{ matrix.runtime_identifier }}
          -PackageVersion ${{ steps.package.outputs.version }}
          -SkipTests

      - name: Upload Store MSIX Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EchoVisualizer-Store-MSIX-${{ steps.package.outputs.version }}-${{ matrix.runtime_identifier }}
          path: |
            artifacts/store-test/${{ matrix.runtime_identifier }}/**/*.msixbundle
            artifacts/store-test/${{ matrix.runtime_identifier }}/**/*.msix
            artifacts/store-test/${{ matrix.runtime_identifier }}/**/*.msixupload
