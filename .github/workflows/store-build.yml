name: Microsoft Store Package Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-bundle:
    name: Build and Validate Store Bundle
    runs-on: windows-2025

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pinned build toolchain
        uses: ./.github/actions/setup-windows-build
        with:
          rust-targets: >-
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc

      - name: Compile and Validate Store MSIX Bundle
        shell: pwsh
        run: >-
          ./scripts/Build-Distributions.ps1
          -Profile Store
          -RuntimeIdentifiers win-x64,win-arm64
          -SkipTests

      - name: Validate Store Bundle Artifact
        shell: pwsh
        run: |
          $storeVersion = ./scripts/Test-ProductConfiguration.ps1 -AsJson |
            ConvertFrom-Json | ForEach-Object { $_.store.versioning.storeVersion }
          $productVersion = ./scripts/Test-ProductConfiguration.ps1 -AsJson |
            ConvertFrom-Json | ForEach-Object { $_.product.version }
          $bundle = Get-ChildItem 'artifacts/store/*.msixbundle' -File |
            Select-Object -First 1
          if (-not $bundle) {
            throw 'Store bundle was not produced under artifacts/store/.'
          }
          ./scripts/Test-StoreReleaseArtifact.ps1 `
            -BundlePath $bundle.FullName `
            -ExpectedProductVersion $productVersion

      - name: Upload Store Bundle Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: EchoVisualizer-Store-Bundle
          path: |
            artifacts/store/*.msixbundle
            artifacts/store/*.zip
          if-no-files-found: error