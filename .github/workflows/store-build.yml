name: Microsoft Store Package Build

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version string override (e.g. 1.0.0.0)'
        required: false
        type: string
        default: '0.1.0.4'

permissions:
  contents: read

jobs:
  build-store-package:
    name: Build Store MSIX Package (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Pre-build Rust Core Engine
        run: cargo build --manifest-path src/core/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Compile and Package Store MSIX Bundle
        shell: pwsh
        run: |
          $ver = "${{ inputs.version_override }}"
          if ($ver -eq "") { $ver = "0.1.0.4" }
          
          dotnet publish src/ui/EchoVisualizer.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:BuildingForStore=true `
            -p:Version="$ver" `
            -p:AssemblyVersion="$ver" `
            -p:FileVersion="$ver" `
            -p:InformationalVersion="$ver"

      - name: Upload Store MSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoVisualizer-Store-MSIX-v${{ inputs.version_override }}
          path: |
            artifacts/store/**/*.msixbundle
            artifacts/store/**/*.msix
            artifacts/store/**/*.msixupload
